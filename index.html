<head>

<meta name="description" content="Slices — an interactive, animated lab for Calculus 1, 2 and 3. Drag the graphs, orbit 3D surfaces, solve quick checks and level up. Works offline.">
<meta name="theme-color" content="#0b1622">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slices">
<meta property="og:title" content="Slices — Calculus 1, 2 & 3 Lab">
<meta property="og:description" content="Interactive calculus: limits to Stokes' theorem, all live and draggable.">

<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/fonts.css">

<link rel="stylesheet" href="styles.css">

</head>
<body>

<div class="topbar">
  <div class="brand">
    <button id="hamburger" aria-label="Toggle menu">☰</button>
    <span class="mark">Slices</span>
    <span class="tag">Calc 1 · 2 · 3 lab</span>
  </div>
  <div class="top-actions">
    <button id="musicBtn"><span class="dot"></span><span id="musicIcon">🔈</span><span id="musicLbl">Music: off</span></button>
  </div>
</div>

<audio id="bgm" src="track.mp3" loop preload="none"></audio>

<div id="mathFloaters" aria-hidden="true"></div>

<div class="scrim" id="scrim"></div>

<div class="app">
  <nav class="sidebar" id="sidebar"><!-- populated by JS from MODULES config --></nav>

  <main>
    <div class="hero">
      <p class="eyebrow" id="courseLabel">Calculus 1</p>
      <h1 id="moduleTitle">Loading…</h1>
      <p id="moduleSub"></p>
    </div>
    <div id="panelHost"><!-- module panels injected here by JS --></div>
  </main>
</div>

<script src="app.js"></script>
<script src="extras.js"></script>
</body>
